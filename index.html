<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas of Resistance · Atlas de la Resistencia</title>
  <meta name="description" content="Atlas of Resistance / Atlas de la Resistencia — coming soon / próximamente.">
  <style>
    :root { --bg: #f7f4ee; --ink: #1f1d1a; --muted: #6b655c; --rule: #d8d1c4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --ink: #f1ede6; --muted: #a39c90; --rule: #3a3631; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; padding: 24px;
    }
    main { max-width: 640px; text-align: center; }
    h1 { font-weight: normal; font-size: clamp(1.8rem, 5vw, 2.8rem); margin: 0 0 .25em; line-height: 1.15; }
    h1 + h1 { font-style: italic; color: var(--muted); }
    hr { width: 64px; border: 0; border-top: 1px solid var(--rule); margin: 2rem auto; }
    p { color: var(--muted); font-size: 1.05rem; margin: .35em 0; }
  </style>
</head>
<body>
  <main>
    <h1>Atlas of Resistance</h1>
    <h1 lang="es">Atlas de la Resistencia</h1>
    <hr>
    <p>Coming soon.</p>
    <p lang="es">Próximamente.</p>
  </main>
</body>
</html>
